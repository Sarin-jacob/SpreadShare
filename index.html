<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SpreadShare</title>
  <meta name="description" content="Serverless group expense splitting backed by your own Google Sheets.">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpreadShare">
  <link rel="icon" type="image/png" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <script>
    // Apply saved theme before first paint to avoid a light/dark flash
    (function () {
      try {
        var d = document.documentElement;
        var dark = localStorage.getItem('ss_cfg_dark');
        if (dark === null ? matchMedia('(prefers-color-scheme: dark)').matches : dark === 'true') d.classList.add('dark');
        if (localStorage.getItem('ss_cfg_oled') === 'true') d.classList.add('oled');
        d.dataset.accent = localStorage.getItem('ss_active_accent') || 'indigo';
        d.style.fontSize = localStorage.getItem('ss_ui_scale') || '16px';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
